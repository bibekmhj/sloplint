name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Verify tag matches pom version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$TAG" != "$POM" ]; then
            echo "Tag $TAG does not match pom version $POM" >&2
            exit 1
          fi
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE:   ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy
      - name: Attach CLI jar to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/sloplint-*-cli.jar
